name: Lint and Auto-Fix

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write      # Required to push fixes
  statuses: write      # Required to report status checks

jobs:
  lint-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Super-Linter needs full history

      - name: Run Super-Linter in Fix Mode
        uses: super-linter/super-linter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Enable fix mode for desired linters
          FIX_SHELL_SHFMT: true
          FIX_YAML_PRETTIER: true
          FIX_PHP: true
          FIX_JS: true
          FIX_CSS: true
          # Add other FIX_* variables for PHP, JS, CSS, etc.
          # Example: FIX_JAVASCRIPT_ES: true

      - name: Commit and Push Fixes
        # This step runs only if the previous step made changes
        if: success() || failure()
        run: |
          if [[ `git status --porcelain` ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: auto-fix linting issues"
            git push
          fi
