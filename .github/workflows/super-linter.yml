name: Lint and Auto-Fix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpcs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install linters and formatters
        run: |
          npm install -g eslint stylelint stylelint-config-standard htmlhint prettier

      - name: Create linter configuration files
        run: |
          echo '{
            "extends": "eslint:recommended",
            "parserOptions": { "ecmaVersion": 2021, "sourceType": "module" },
            "env": { "browser": true, "node": true }
          }' > .eslintrc.json
          echo '{
            "extends": "stylelint-config-standard"
          }' > .stylelintrc.json
          echo 'html/js/md5.js' > .eslintignore

      - name: Run linters with auto-fix
        uses: wearerequired/lint-action@v3
        with:
          auto_fix: true
          commit: false
          php_codesniffer: true
          php_codesniffer_args: '--standard=PSR12'
          eslint: true
          stylelint: true
          prettier: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate HTML
        run: npx htmlhint "html/**/*.html"

      - name: Format HTML, CSS, JS with Prettier
        run: npx prettier --write "html/**/*.html" "html/**/*.css" "html/**/*.js"

      - name: Commit and push fixes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: auto-fix linting issues'
