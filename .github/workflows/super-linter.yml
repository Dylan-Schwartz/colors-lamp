name: Lint and Auto-Fix Code Base

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Grant write permissions so the workflow can push the fixes.
permissions:
  contents: write
  statuses: write

jobs:
  run-lint-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint and Auto-Fix Code Base
        uses: super-linter/super-linter@v7
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --- Enable Fix Mode for Specific Languages ---
          FIX_CSS_PRETTIER: true
          FIX_HTML_PRETTIER: true
          FIX_JAVASCRIPT_ES: true
          FIX_JAVASCRIPT_PRETTIER: true
          FIX_PHP_PHPCS: true

      - name: Commit and Push Fixes
        if: always()
        run: |
          if [[ `git status --porcelain` ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: auto-fix linting and formatting issues"
            git push
          fi
